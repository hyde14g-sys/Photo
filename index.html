<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>照片編輯器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:        #1a1a1f;
    --surface:   #24242c;
    --panel:     #2d2d38;
    --border:    #3a3a48;
    --accent:    #e8ff5a;
    --accent2:   #ff6b6b;
    --accent3:   #5affda;
    --text:      #f0f0f0;
    --muted:     #888899;
    --toolbar-h: 54px;
    --statusbar-h: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Title Bar ── */
  #titlebar {
    height: 40px;
    background: var(--panel);
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    flex-shrink: 0;
  }
  #titlebar .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  #titlebar .sep { flex: 1; }
  #titlebar .filename { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  /* ── Toolbar Row 1 ── */
  #toolbar-row1 {
    height: var(--toolbar-h);
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    overflow-x: auto;
    overflow-y: visible;
    flex-shrink: 0;
    scrollbar-width: none;
    position: relative;
    z-index: 10;
  }
  #toolbar-row1::-webkit-scrollbar { display: none; }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 4px;
    border-right: 1.5px solid var(--border);
    flex-shrink: 0;
    height: 100%;
  }
  .tool-group:last-child { border-right: none; }

  .tool-btn {
    width: 42px;
    height: 42px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
    font-size: 18px;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
    flex-shrink: 0;
  }
  .tool-btn span.label {
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .tool-btn:hover  { background: var(--panel); border-color: var(--border); }
  .tool-btn.active {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tool-btn.active span.label { color: var(--accent); }
  .tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #btn-camera {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: var(--accent);
  }
  #btn-camera:hover { background: color-mix(in srgb, var(--accent) 32%, transparent); }

  /* ── Color Button ── */
  #btn-color {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
    transition: border-color 0.15s;
    position: relative;
  }
  #btn-color:hover { border-color: var(--accent3); }
  #color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: #e8000d;
    pointer-events: none;
  }
  #btn-color span.label {
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 0.04em;
    line-height: 1;
    font-family: 'DM Mono', monospace;
  }
  #color-input { display: none; }

  /* ── Color Palette Popup ── */
  #color-popup {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    flex-direction: column;
    gap: 8px;
  }
  #color-popup.open { display: flex; }
  .palette-row { display: flex; gap: 6px; }
  .palette-swatch {
    width: 28px; height: 28px;
    border-radius: 5px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }
  .palette-swatch:hover { transform: scale(1.15); }
  .palette-swatch.selected { border-color: #fff; }
  .palette-divider { height: 1px; background: var(--border); }
  .palette-custom-btn {
    width: 100%;
    padding: 6px 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-align: center;
    transition: border-color 0.15s;
  }
  .palette-custom-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  /* ── Brush Size Buttons ── */
  .size-btn {
    width: 42px; height: 42px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .size-btn:hover  { background: var(--panel); border-color: var(--border); }
  .size-btn.active {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border-color: var(--accent);
  }
  .size-dot { background: var(--text); border-radius: 50%; flex-shrink: 0; }
  .size-btn.active .size-dot { background: var(--accent); }
  .size-btn span.label {
    font-size: 7px; color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em; line-height: 1;
  }
  .size-btn.active span.label { color: var(--accent); }

  /* ── Canvas Area ── */
  #canvas-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #111116;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-area::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(45deg, #1e1e26 25%, transparent 25%),
      linear-gradient(-45deg, #1e1e26 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1e1e26 75%),
      linear-gradient(-45deg, transparent 75%, #1e1e26 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    opacity: 0.4;
  }
  #main-canvas {
    display: none;
    position: relative; z-index: 1;
    cursor: crosshair;
    touch-action: none;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
  }

  /* ── Empty State ── */
  #empty-state {
    position: absolute; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    text-align: center; padding: 32px;
  }
  #empty-state .icon { font-size: 64px; opacity: 0.3; animation: float 3s ease-in-out infinite; }
  #empty-state h2 {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
    letter-spacing: 0.04em; color: var(--text); opacity: 0.7;
  }
  #empty-state p { font-size: 12px; color: var(--muted); line-height: 1.6; max-width: 240px; }
  #empty-cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .cta-btn {
    padding: 10px 20px; border-radius: 8px; border: 1.5px solid;
    font-family: 'DM Mono', monospace; font-size: 12px;
    cursor: pointer; letter-spacing: 0.06em; transition: all 0.2s;
  }
  .cta-btn.primary  { background: var(--accent); border-color: var(--accent); color: #1a1a1f; font-weight: 600; }
  .cta-btn.primary:hover { filter: brightness(1.1); }
  .cta-btn.secondary { background: transparent; border-color: var(--border); color: var(--text); }
  .cta-btn.secondary:hover { border-color: var(--accent3); color: var(--accent3); }

  /* ── Status Bar ── */
  #statusbar {
    height: var(--statusbar-h);
    background: var(--panel);
    border-top: 1.5px solid var(--border);
    display: flex; align-items: center;
    padding: 0 12px; gap: 16px; flex-shrink: 0;
  }
  .status-item {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 5px;
  }
  .status-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .status-item.ready .dot { background: var(--accent3); }
  .status-item.warn  .dot { background: var(--accent); }

  /* ── Camera Modal ── */
  #camera-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); z-index: 100;
    flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 20px;
  }
  #camera-modal.open { display: flex; }
  #camera-modal h3 {
    font-family: 'Syne', sans-serif; font-size: 16px;
    font-weight: 800; letter-spacing: 0.06em; color: var(--accent);
  }
  #video-preview {
    width: 100%; max-width: 480px; aspect-ratio: 4/3;
    border-radius: 12px; background: #000;
    border: 1.5px solid var(--border); object-fit: cover; display: block;
  }
  .modal-actions { display: flex; gap: 12px; align-items: center; }
  .modal-btn {
    padding: 12px 24px; border-radius: 8px; border: 1.5px solid;
    font-family: 'DM Mono', monospace; font-size: 13px;
    cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s;
  }
  .modal-btn.snap {
    background: var(--accent); border-color: var(--accent); color: #1a1a1f;
    font-weight: 600; font-size: 22px;
    width: 62px; height: 62px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .modal-btn.snap:hover { filter: brightness(1.15); transform: scale(1.05); }
  .modal-btn.cancel { background: transparent; border-color: var(--border); color: var(--text); }
  .modal-btn.cancel:hover { border-color: var(--accent2); color: var(--accent2); }
  #camera-msg { font-size: 11px; color: var(--muted); text-align: center; }
  #capture-canvas { display: none; }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  .flash {
    position: fixed; inset: 0; z-index: 200;
    background: #fff; pointer-events: none;
    animation: flashAnim 0.3s ease-out forwards;
  }
  @keyframes flashAnim { 0% { opacity:.9; } 100% { opacity:0; } }
</style>
</head>
<body>

<!-- Title Bar -->
<div id="titlebar">
  <span class="logo">✦ PIXEDIT</span>
  <span class="sep"></span>
  <span class="filename" id="filename-label">尚未載入影像</span>
</div>

<!-- ═══ Toolbar Row 1 ═══ -->
<div id="toolbar-row1">

  <!-- 拍照 / 讀檔 / 存檔 -->
  <div class="tool-group">
    <button class="tool-btn" id="btn-camera" onclick="openCamera()" title="拍照">
      📷<span class="label">拍照</span>
    </button>
    <button class="tool-btn" onclick="openFile()" title="讀檔">
      🗂️<span class="label">讀檔</span>
    </button>
    <button class="tool-btn" onclick="saveImage()" title="存檔">
      💾<span class="label">存檔</span>
    </button>
  </div>

  <!-- 鉛筆 -->
  <div class="tool-group">
    <button class="tool-btn active" id="tool-pencil" onclick="setTool('pencil')" title="鉛筆">
      ✏️<span class="label">鉛筆</span>
    </button>
  </div>

  <!-- 顏色 -->
  <div class="tool-group" style="position:relative;">
    <button id="btn-color" onclick="toggleColorPopup()" title="鉛筆顏色">
      <div id="color-swatch"></div>
      <span class="label">顏色</span>
    </button>
    <input type="color" id="color-input" value="#e8000d" oninput="applyCustomColor(this.value)">

    <div id="color-popup">
      <div class="palette-row">
        <div class="palette-swatch" style="background:#000000" onclick="pickColor('#000000')"></div>
        <div class="palette-swatch" style="background:#ffffff" onclick="pickColor('#ffffff')"></div>
        <div class="palette-swatch" style="background:#888888" onclick="pickColor('#888888')"></div>
        <div class="palette-swatch" style="background:#cccccc" onclick="pickColor('#cccccc')"></div>
        <div class="palette-swatch" style="background:#4a4a4a" onclick="pickColor('#4a4a4a')"></div>
      </div>
      <div class="palette-row">
        <div class="palette-swatch selected" style="background:#e8000d" onclick="pickColor('#e8000d')"></div>
        <div class="palette-swatch" style="background:#ff6b35" onclick="pickColor('#ff6b35')"></div>
        <div class="palette-swatch" style="background:#ffcc00" onclick="pickColor('#ffcc00')"></div>
        <div class="palette-swatch" style="background:#00c851" onclick="pickColor('#00c851')"></div>
        <div class="palette-swatch" style="background:#007bff" onclick="pickColor('#007bff')"></div>
      </div>
      <div class="palette-row">
        <div class="palette-swatch" style="background:#e91e63" onclick="pickColor('#e91e63')"></div>
        <div class="palette-swatch" style="background:#9c27b0" onclick="pickColor('#9c27b0')"></div>
        <div class="palette-swatch" style="background:#00bcd4" onclick="pickColor('#00bcd4')"></div>
        <div class="palette-swatch" style="background:#8bc34a" onclick="pickColor('#8bc34a')"></div>
        <div class="palette-swatch" style="background:#ff5722" onclick="pickColor('#ff5722')"></div>
      </div>
      <div class="palette-divider"></div>
      <button class="palette-custom-btn" onclick="openCustomColor()">🎨 自訂顏色</button>
    </div>
  </div>

  <!-- 粗細（4 段） -->
  <div class="tool-group">
    <button class="size-btn active" id="size-1" onclick="setBrushSize(2,1)" title="細">
      <div class="size-dot" style="width:4px;height:4px"></div>
      <span class="label">細</span>
    </button>
    <button class="size-btn" id="size-2" onclick="setBrushSize(5,2)" title="中細">
      <div class="size-dot" style="width:7px;height:7px"></div>
      <span class="label">中細</span>
    </button>
    <button class="size-btn" id="size-3" onclick="setBrushSize(10,3)" title="中粗">
      <div class="size-dot" style="width:12px;height:12px"></div>
      <span class="label">中粗</span>
    </button>
    <button class="size-btn" id="size-4" onclick="setBrushSize(20,4)" title="粗">
      <div class="size-dot" style="width:18px;height:18px"></div>
      <span class="label">粗</span>
    </button>
  </div>

  <!-- 返回 / 前進 -->
  <div class="tool-group">
    <button class="tool-btn" id="btn-undo" onclick="undoAction()" title="返回上一步" disabled>
      ↩️<span class="label">返回</span>
    </button>
    <button class="tool-btn" id="btn-redo" onclick="redoAction()" title="前進下一步" disabled>
      ↪️<span class="label">前進</span>
    </button>
  </div>

</div>

<!-- Canvas Area -->
<div id="canvas-area">
  <div id="empty-state">
    <div class="icon">📷</div>
    <h2>尚未載入任何影像</h2>
    <p>點擊「拍照」直接使用相機，或開啟現有圖片開始編輯</p>
    <div id="empty-cta">
      <button class="cta-btn primary"   onclick="openCamera()">📷 拍照</button>
      <button class="cta-btn secondary" onclick="openFile()">🗂️ 開啟圖片</button>
    </div>
  </div>
  <canvas id="main-canvas"></canvas>
</div>

<!-- Status Bar -->
<div id="statusbar">
  <div class="status-item ready" id="status-state">
    <div class="dot"></div>
    <span id="status-text">就緒</span>
  </div>
  <div class="status-item"><span id="dim-text">—</span></div>
  <div class="status-item"><span id="tool-text">工具：鉛筆</span></div>
</div>

<!-- Camera Modal -->
<div id="camera-modal">
  <h3>📷 相機預覽</h3>
  <video id="video-preview" autoplay playsinline muted></video>
  <canvas id="capture-canvas"></canvas>
  <p id="camera-msg">對準目標後按下快門</p>
  <div class="modal-actions">
    <button class="modal-btn cancel" onclick="closeCamera()">✕ 取消</button>
    <button class="modal-btn snap"   onclick="capturePhoto()">◉</button>
    <button class="modal-btn cancel" onclick="switchCamera()">🔄 翻轉</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadImageFile(event)">

<script>
// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
const canvas    = document.getElementById('main-canvas');
const ctx       = canvas.getContext('2d');
let imageLoaded = false;
let currentTool = 'pencil';
let brushColor  = '#e8000d';
let brushSize   = 2;
let isDrawing   = false;
let lastX = 0, lastY = 0;

const MAX_HISTORY = 30;
let undoStack = [];
let redoStack = [];

let currentStream = null;
let facingMode    = 'environment';

// ════════════════════════════════════════════
//  HISTORY
// ════════════════════════════════════════════
function saveHistory() {
  undoStack.push(canvas.toDataURL());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateHistoryBtns();
}

function updateHistoryBtns() {
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  document.getElementById('btn-redo').disabled = redoStack.length === 0;
}

function restoreDataURL(dataURL) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); resolve(); };
    img.src = dataURL;
  });
}

async function undoAction() {
  if (!undoStack.length) return;
  redoStack.push(canvas.toDataURL());
  await restoreDataURL(undoStack.pop());
  updateHistoryBtns();
  setStatus('已返回上一步', 'ready');
}

async function redoAction() {
  if (!redoStack.length) return;
  undoStack.push(canvas.toDataURL());
  await restoreDataURL(redoStack.pop());
  updateHistoryBtns();
  setStatus('已前進下一步', 'ready');
}

// ════════════════════════════════════════════
//  TOOLS
// ════════════════════════════════════════════
function setTool(name) {
  currentTool = name;
  document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + name);
  if (btn) btn.classList.add('active');
  const labels = { pencil: '鉛筆' };
  document.getElementById('tool-text').textContent = '工具：' + (labels[name] || name);
  canvas.style.cursor = 'crosshair';
}

// ════════════════════════════════════════════
//  BRUSH SIZE
// ════════════════════════════════════════════
function setBrushSize(px, idx) {
  brushSize = px;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('size-' + idx).classList.add('active');
}

// ════════════════════════════════════════════
//  COLOR
// ════════════════════════════════════════════
function toggleColorPopup() {
  document.getElementById('color-popup').classList.toggle('open');
}
function closeColorPopup() {
  document.getElementById('color-popup').classList.remove('open');
}
function pickColor(hex) {
  brushColor = hex;
  document.getElementById('color-swatch').style.background = hex;
  document.querySelectorAll('.palette-swatch').forEach(s => {
    const bg = s.style.background.replace(/\s/g,'').toLowerCase();
    s.classList.toggle('selected', bg === hex || bg === hexToRgbStr(hex));
  });
  closeColorPopup();
}
function applyCustomColor(hex) {
  brushColor = hex;
  document.getElementById('color-swatch').style.background = hex;
  document.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('selected'));
}
function openCustomColor() {
  const inp = document.getElementById('color-input');
  inp.value = brushColor;
  inp.click();
  closeColorPopup();
}
function hexToRgbStr(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r},${g},${b})`;
}
document.addEventListener('pointerdown', e => {
  const popup = document.getElementById('color-popup');
  if (popup.classList.contains('open') &&
      !popup.contains(e.target) &&
      !document.getElementById('btn-color').contains(e.target)) {
    closeColorPopup();
  }
});

// ════════════════════════════════════════════
//  DRAWING
// ════════════════════════════════════════════
function getPos(e) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const src    = e.touches ? e.touches[0] : e;
  return [(src.clientX - rect.left) * scaleX, (src.clientY - rect.top) * scaleY];
}

canvas.addEventListener('pointerdown', e => {
  if (currentTool !== 'pencil' || !imageLoaded) return;
  e.preventDefault();
  saveHistory();
  isDrawing = true;
  [lastX, lastY] = getPos(e);
  ctx.beginPath();
  ctx.arc(lastX, lastY, brushSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = brushColor;
  ctx.fill();
});

canvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  e.preventDefault();
  const [x, y] = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.strokeStyle = brushColor;
  ctx.lineWidth   = brushSize;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();
  [lastX, lastY] = [x, y];
});

canvas.addEventListener('pointerup',  () => { isDrawing = false; });
canvas.addEventListener('pointerout', () => { isDrawing = false; });

// ════════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════════
async function openCamera() {
  document.getElementById('camera-modal').classList.add('open');
  await startStream();
}
async function startStream() {
  if (currentStream) stopStream();
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
    });
    document.getElementById('video-preview').srcObject = currentStream;
    document.getElementById('camera-msg').textContent = '對準目標後按下快門';
  } catch (err) {
    document.getElementById('camera-msg').textContent = '⚠️ 無法存取相機：' + err.message;
  }
}
function stopStream() {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
}
function closeCamera() {
  stopStream();
  document.getElementById('camera-modal').classList.remove('open');
  document.getElementById('video-preview').srcObject = null;
}
async function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await startStream();
}
function capturePhoto() {
  const video = document.getElementById('video-preview');
  const cap   = document.getElementById('capture-canvas');
  cap.width   = video.videoWidth  || 1280;
  cap.height  = video.videoHeight || 720;
  cap.getContext('2d').drawImage(video, 0, 0, cap.width, cap.height);
  const flash = document.createElement('div');
  flash.className = 'flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 400);
  const img = new Image();
  img.onload = () => { loadImageToCanvas(img, 'camera_' + Date.now() + '.jpg'); closeCamera(); };
  img.src = cap.toDataURL('image/jpeg', 0.95);
}

// ════════════════════════════════════════════
//  FILE I/O
// ════════════════════════════════════════════
function openFile() { document.getElementById('file-input').click(); }
function loadImageFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => loadImageToCanvas(img, file.name);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function loadImageToCanvas(img, name) {
  canvas.width  = img.naturalWidth  || img.width;
  canvas.height = img.naturalHeight || img.height;
  ctx.drawImage(img, 0, 0);
  canvas.style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('filename-label').textContent = name;
  document.getElementById('dim-text').textContent = canvas.width + ' × ' + canvas.height + ' px';
  imageLoaded = true;
  undoStack = []; redoStack = [];
  updateHistoryBtns();
  setTool('pencil');
  setStatus('影像已載入', 'ready');
}
function saveImage() {
  if (!imageLoaded) { setStatus('⚠️ 尚未載入影像', 'warn'); return; }
  const link    = document.createElement('a');
  link.download = 'pixedit_' + Date.now() + '.png';
  link.href     = canvas.toDataURL('image/png');
  link.click();
  setStatus('已儲存影像', 'ready');
}

// ════════════════════════════════════════════
//  STATUS
// ════════════════════════════════════════════
function setStatus(msg, type = 'ready') {
  document.getElementById('status-state').className = 'status-item ' + type;
  document.getElementById('status-text').textContent = msg;
}

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// init
document.getElementById('color-swatch').style.background = brushColor;
</script>
